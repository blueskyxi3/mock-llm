# Apply to an existing namespace; see README.md for image and Secret setup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-llm-config
data:
  # LoadConfig merges these fields into the built-in defaults, retaining all
  # eight models. A models array, if added, replaces the entire model list.
  config.json: |
    {
      "listen": ":8080",
      "max_body_bytes": 16777216,
      "max_context_tokens": 131072,
      "default_output_tokens": 256,
      "max_output_tokens": 8192,
      "max_active": 4096,
      "max_batch": 128,
      "request_timeout_seconds": 120,
      "shutdown_seconds": 120
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  labels:
    app.kubernetes.io/name: mock-llm
spec:
  # Keep replica count fixed during each benchmark for comparable results.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-llm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-llm
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 135
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-llm
          image: registry-prd-cn-beijing.cr.volces.com/ai-hub/mock-llm:0.1.0-850fff65b14d
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/mock-llm/config.json"]
          env:
            - name: MOCK_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mock-llm-auth
                  key: api-key
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              # CPU limit omitted to avoid throttling the mock during tests.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/mock-llm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mock-llm-config
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  labels:
    app.kubernetes.io/name: mock-llm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-llm
  ports:
    - name: http
      port: 8080
      targetPort: http
